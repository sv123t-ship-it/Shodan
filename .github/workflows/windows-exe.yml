name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build standalone GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShodanExcel shodan_gui.py
      - name: Check packaged GUI startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist\ShodanExcel.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) {
            $app.Kill()
            throw 'GUI startup check timed out'
          }
          if ($app.ExitCode -ne 0) { throw "GUI startup failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ShodanExcel-Windows-x64
          path: dist/ShodanExcel.exe
          if-no-files-found: error
